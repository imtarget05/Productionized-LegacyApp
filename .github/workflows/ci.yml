name: "Productionize Legacy App CI/CD"

on:
  push:
    branches: [main]
    paths: ['02-Productionized-LegacyApp/**']
  pull_request:
    paths: ['02-Productionized-LegacyApp/**']

env:
  IMAGE: legacy-inventory-worker

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 1. Smoke tests (built-in node:test) — catch regressions before container work.
    - name: Unit smoke tests
      working-directory: 02-Productionized-LegacyApp/src
      run: |
        npm ci --omit=dev
        npm test

    # 2. DevOps Best Practice: quét lỗ hổng bảo mật của code & dependencies cũ
    - name: Run Trivy vulnerability scanner on Repo
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: 'fs'
        format: 'table'
        exit-code: '0'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v6
      with:
        context: 02-Productionized-LegacyApp
        push: false
        load: true
        tags: ${{ env.IMAGE }}:ci

    # 3. DevOps Best Practice: quét lỗ hổng Docker Image
    - name: Scan Docker Image
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: ${{ env.IMAGE }}:ci
        format: 'table'
        exit-code: '0'

  deploy:
    # Chỉ deploy khi push main và khi secrets đã cấu hình.
    needs: test-and-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and Push Image
      uses: docker/build-push-action@v6
      with:
        context: 02-Productionized-LegacyApp
        push: true
        tags: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE }}:latest

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # Web App đã được khai báo bằng Terraform; job này chỉ restart để pull image mới.
    - name: Restart Web App to pull latest image
      run: az webapp restart --name app-legacy-inventory-sync --resource-group rg-legacy-apps

