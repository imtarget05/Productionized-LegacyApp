# L8 — shared north-south routing for the legacy app. Hostname-based (no
# base-path rewrite), cross-namespace parentRef to the portfolio Gateway,
# same-namespace backendRef → no ReferenceGrant needed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: legacy
  namespace: legacyapp
spec:
  parentRefs:
    - name: portfolio-gateway
      namespace: platform-gateway
      sectionName: http
  hostnames:
    - legacy.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: legacy-app
          port: 80
